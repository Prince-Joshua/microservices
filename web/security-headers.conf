add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
# Ignored over plain http, so harmless for local use; applies once HTTPS sits in front.
add_header Strict-Transport-Security "max-age=31536000" always;
# Scripts only from this origin (no inline, no eval), and the page may only talk to this origin,
# so injected code can't load a payload or send data elsewhere. Inline styles are needed by Chakra/Emotion.
# Product images may come from any https site (admins paste links); change img-src to list hosts if you can.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
