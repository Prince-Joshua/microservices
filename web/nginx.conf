# Container version: upstream names are the compose service names.
# (Bare-metal version with 127.0.0.1 upstreams: deploy/nginx.host.conf)

# One JSON line per request, with the id that follows the request through every
# service (see deploy/trace.sh). $uri has no query string, so tokens never get logged.
log_format trace escape=json
  '{"ts":"$time_iso8601","level":"info","service":"gateway","requestId":"$request_id",'
  '"msg":"request","method":"$request_method","path":"$uri","status":$status,'
  '"sec":$request_time,"upstream":"$upstream_addr","remote":"$remote_addr"}';

# Brute-force guard for login/register: 10 requests/minute per IP.
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

# Docker's embedded DNS returns every replica's IP for a service name. Using
# variables in proxy_pass makes nginx re-resolve every few seconds (so restarted
# or scaled replicas are picked up, and nginx can start before they are up),
# and round-robins across the addresses it gets back.
resolver 127.0.0.11 valid=5s ipv6=off;

server {
  listen 80;
  server_name _;

  client_max_body_size 1m;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  access_log /dev/stdout trace;

  # add_header is NOT inherited by a location that has its own add_header,
  # so the static locations below include this file again.
  include /etc/nginx/security-headers.conf;

  proxy_http_version 1.1;
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  # nginx makes the id (any client-supplied one is replaced). The services echo it
  # back in the response, so it isn't added to proxied responses here.
  proxy_set_header X-Request-Id      $request_id;
  proxy_read_timeout 30s;

  # --- Never reachable from outside: service-to-service routes -------------
  # Regex locations beat prefix locations, so this wins over /api/*/ below.
  location ~ ^/(api/[^/]+/)?internal/ { return 404; }

  # --- API: one address, four services --------------------------------------
  # The trailing slash strips the /api/<name> prefix (same as the Vite dev proxy).
  # With variables, proxy_pass can't strip the prefix itself, so rewrite does it.
  location /api/users/auth/ {
    limit_req zone=auth burst=10 nodelay;
    set $up http://users:4001;
    rewrite ^/api/users/(.*)$ /$1 break;
    proxy_pass $up;
  }
  location /api/users/ {
    set $up http://users:4001;
    rewrite ^/api/users/(.*)$ /$1 break;
    proxy_pass $up;
  }
  location /api/products/ {
    set $up http://products:4002;
    rewrite ^/api/products/(.*)$ /$1 break;
    proxy_pass $up;
  }
  location /api/orders/ {
    set $up http://orders:4000;
    rewrite ^/api/orders/(.*)$ /$1 break;
    proxy_pass $up;
  }

  # --- Paystack webhook: the ONLY payments-service route that is public ----
  # Body is passed through untouched; the service checks the HMAC of the raw body.
  location = /webhooks/paystack {
    set $up http://payments:4003;
    proxy_pass $up;
  }

  # --- The React app --------------------------------------------------------
  root /usr/share/nginx/html;

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Request-Id $request_id always;
    include /etc/nginx/security-headers.conf;
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    add_header X-Request-Id $request_id always;
    include /etc/nginx/security-headers.conf;
    try_files $uri /index.html;   # client-side routes like /orders/123
  }
}
