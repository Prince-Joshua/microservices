# PRACTICE: the products service split into three deployables that share ONE database.
#
#   docker compose -f docker-compose.prod.yml -f docker-compose.split.yml up -d --build
#
# Needs Docker Compose 2.24+ (uses !override). Walkthrough: deploy/SPLIT-PRODUCTS.md
#
#   catalog     :4011  /products*           shoppers + admins        (JWT_SECRET, plus the users service to check sessions)
#   inventory   :4012  /internal/*          stock for the saga       (INTERNAL_API_TOKEN only)
#   reconciler  :4013  background job       repairs stuck reservations
#   router      :4002  nginx, alias "products": sends /internal/* to inventory, the rest to catalog
#
# All three connect to the same products-mongo database. Each gets only the secrets it needs.
x-part: &part
  image: shop-products:local   # one image, three commands
  restart: unless-stopped
  stop_grace_period: 20s
  build:
    context: ./products-service
    dockerfile: Dockerfile
  depends_on:
    products-mongo: { condition: service_healthy }

services:
  # The all-in-one app is switched off in split mode.
  products:
    profiles: ["unsplit"]

  products-catalog:
    <<: *part
    command: ["node", "dist/servers/catalog.js"]
    environment:
      NODE_ENV: production
      PORT: 4011
      MONGO_URL: mongodb://products-mongo:27017/products
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      # Used only to ask the users service whether a session is still alive.
      USERS_SERVICE_URL: http://users:4001
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?set INTERNAL_API_TOKEN in .env}
    deploy:
      replicas: ${CATALOG_REPLICAS:-2}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4011/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  products-inventory:
    <<: *part
    command: ["node", "dist/servers/inventory.js"]
    environment:
      NODE_ENV: production
      PORT: 4012
      MONGO_URL: mongodb://products-mongo:27017/products
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?set INTERNAL_API_TOKEN in .env}
    deploy:
      replicas: ${INVENTORY_REPLICAS:-2}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4012/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  products-reconciler:
    <<: *part
    command: ["node", "dist/servers/reconciler.js"]
    environment:
      NODE_ENV: production
      PORT: 4013
      MONGO_URL: mongodb://products-mongo:27017/products
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?set INTERNAL_API_TOKEN in .env}
      ORDERS_SERVICE_URL: http://orders:4000
    deploy:
      replicas: 1
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4013/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  products-router:
    image: nginx:1.27-alpine
    restart: unless-stopped
    networks:
      default:
        aliases: [products]
    volumes:
      - ./deploy/products-router.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      products-catalog: { condition: service_healthy }
      products-inventory: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4002/router-health"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Wait for the router instead of the (now disabled) all-in-one service.
  gateway:
    depends_on: !override
      users: { condition: service_healthy }
      products-router: { condition: service_healthy }
      orders: { condition: service_healthy }
      payments: { condition: service_healthy }
