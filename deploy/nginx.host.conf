# For running nginx directly on a server (services on localhost, no Docker).
# Save as /etc/nginx/conf.d/shop.conf, build the app (`pnpm -C web build`) and
# copy web/dist to /var/www/shop. Then add HTTPS: `sudo certbot --nginx`.

log_format trace escape=json
  '{"ts":"$time_iso8601","level":"info","service":"gateway","requestId":"$request_id",'
  '"msg":"request","method":"$request_method","path":"$uri","status":$status,'
  '"sec":$request_time,"upstream":"$upstream_addr","remote":"$remote_addr"}';

limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

server {
  listen 80;
  server_name shop.example.com;

  access_log /var/log/nginx/shop-access.log trace;
  client_max_body_size 1m;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  proxy_http_version 1.1;
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Request-Id      $request_id;

  location ~ ^/(api/[^/]+/)?internal/ { return 404; }

  location /api/users/auth/ {
    limit_req zone=auth burst=10 nodelay;
    proxy_pass http://127.0.0.1:4001/auth/;
  }
  location /api/users/    { proxy_pass http://127.0.0.1:4001/; }
  location /api/products/ { proxy_pass http://127.0.0.1:4002/; }
  location /api/orders/   { proxy_pass http://127.0.0.1:4000/; }

  location = /webhooks/paystack { proxy_pass http://127.0.0.1:4003; }

  root /var/www/shop;
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
  location / { add_header Cache-Control "no-cache"; try_files $uri /index.html; }
}

# Running more than one copy of a service on the same host? Replace its proxy_pass
# target with an upstream group, e.g.
#   upstream orders_up { server 127.0.0.1:4000; server 127.0.0.1:5000; }
#   location /api/orders/ { rewrite ^/api/orders/(.*)$ /$1 break; proxy_pass http://orders_up; }
