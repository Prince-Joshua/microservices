# Internal front door for the split products service. It listens on 4002 and has the
# network alias "products", so the public gateway and the Orders service keep using
# http://products:4002 without any change. It decides which part answers:
#   /internal/*  -> products-inventory   (stock reservations; only other services call it)
#   everything else -> products-catalog  (shop and admin)
resolver 127.0.0.11 valid=5s ipv6=off;

# Keep the caller's request id; make one if the call came without it.
map $http_x_request_id $trace_id {
  default $http_x_request_id;
  ""      $request_id;
}

log_format trace escape=json
  '{"ts":"$time_iso8601","level":"info","service":"products-router","requestId":"$trace_id",'
  '"msg":"request","method":"$request_method","path":"$uri","status":$status,'
  '"sec":$request_time,"upstream":"$upstream_addr"}';

server {
  listen 4002;
  access_log /dev/stdout trace;

  proxy_http_version 1.1;
  proxy_set_header Host            $host;
  proxy_set_header X-Real-IP       $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Request-Id    $trace_id;
  proxy_read_timeout 30s;

  location = /router-health { access_log off; return 200 "ok"; }

  location /internal/ {
    set $up http://products-inventory:4012;
    proxy_pass $up;
  }

  location / {
    set $up http://products-catalog:4011;
    proxy_pass $up;
  }
}
